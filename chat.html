<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PentePal — Chat</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="chat-shell">
  <div class="scrim" id="scrim"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-crest"><img src="logo.jpg" alt="Pentecost Preparatory School crest" /></div>
      <div>
        <h1 class="font-display">PentePal</h1>
        <p>Pentecost Prep School</p>
      </div>
    </div>

    <div class="sidebar-section-label">Subjects</div>
    <nav class="subject-nav" id="subjectNav">
      <button class="subject-link" data-prompt="Can you help me with a Mathematics problem?">Mathematics</button>
      <button class="subject-link" data-prompt="Can you help explain something in English Language?">English</button>
      <button class="subject-link" data-prompt="Can you help me with an Integrated Science question?">Science</button>
      <button class="subject-link" data-prompt="Can you help me with Social Studies?">Social Studies</button>
      <button class="subject-link" data-prompt="Can you help me with French?">French</button>
      <button class="subject-link" data-prompt="Can you help me with ICT?">ICT</button>
      <button class="subject-link" data-prompt="Can you help me with R.M.E?">R.M.E</button>
    </nav>

    <div class="sidebar-footer">
      <div class="user-row">
        <div class="user-chip">
          <div class="avatar" id="avatarInitial">?</div>
          <div>
            <div class="user-name" id="usernameLabel">Student</div>
            <div class="user-sub">Signed in</div>
          </div>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"></button>
      </div>
      <button class="logout-link" id="logoutBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Log out
      </button>
    </div>
  </aside>

  <div class="main-panel">
    <header class="main-header">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <h2 class="font-display">Your study companion</h2>
      <p>Ask anything, get a clear answer</p>
      <svg class="steps" viewBox="0 0 400 14" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 14 L0 10 L40 10 L40 7 L80 7 L80 4 L400 4" fill="none" stroke="#4E93C4" stroke-width="1.5" opacity="0.55"/>
      </svg>
    </header>

    <div id="chat">
      <div class="empty-state" id="emptyState">
        <p>Loading your conversation...</p>
      </div>
    </div>

    <div class="hint">PentePal gives concise answers — ask a follow-up any time.</div>

    <form id="composer">
      <textarea id="promptInput" rows="1" placeholder="Type your question..." aria-label="Your question"></textarea>
      <button type="submit" id="sendBtn" aria-label="Send question">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </button>
    </form>
  </div>
</div>

<script type="module" src="js/chat.js"></script>
</body>
</html>
